# Tests every push and pull request. For main it also builds the Docker images,
# pushes them to GitHub's registry (ghcr.io) and deploys them to the server.
# One-time setup for the deploy: README > Deployment > Automatic deploys.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the "Run workflow" button: tests and deploys main again

permissions:
  contents: read

# Runs for main wait for each other, so deploys happen one at a time and in push
# order. A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/the-yusuf/course-platform # the same name as in compose.yaml and deploy/deploy.sh

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: course-platform
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # the e2e suite creates and drops its own "course-platform-e2e" database next to this one
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/course-platform
      ACCESS_TOKEN_SECRET: only-for-ci-tests-not-a-real-secret-at-all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
      LABELS: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.revision=${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The GitHub Actions cache keeps every stage, so libvips is compiled only
      # when its version or the base image changes.
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:api-${{ github.sha }}
          labels: ${{ env.LABELS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build
          load: true
          tags: ${{ env.IMAGE }}:migrate-${{ github.sha }}
          labels: ${{ env.LABELS }}
          cache-from: type=gha
      - name: Check the API image on the server's CPU
        run: deploy/cpu-check.sh "$IMAGE:api-$GITHUB_SHA"
      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the images
        if: env.PUBLISH == 'true'
        run: |
          docker push --quiet "$IMAGE:api-$GITHUB_SHA"
          docker push --quiet "$IMAGE:migrate-$GITHUB_SHA"

  deploy:
    # Skipped until the repository variable DEPLOY_HOST is set
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://dili-chinese.uz/api/health
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server runs deploy/deploy.sh for this key and passes it the commit
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
      - name: Check the API through nginx
        run: curl -fsS --retry 5 --retry-all-errors --max-time 10 https://dili-chinese.uz/api/health
