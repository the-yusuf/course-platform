# nginx site for the API. On the server:
#   sudo cp deploy/nginx/course-platform-api.conf /etc/nginx/sites-available/course-platform-api
#   then replace api.example.uz below with your API domain.
# certbot adds the HTTPS (443) part and the http -> https redirect to this file itself.

# Requests for any other name, or for the bare IP, are dropped
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.uz;

    server_tokens off;

    # avatars and course images can be 5 MB; nginx's default limit is 1 MB
    client_max_body_size 6m;

    # compress JSON responses
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the same id appears in nginx's log and the API's log
        proxy_set_header X-Request-Id $request_id;
    }
}
