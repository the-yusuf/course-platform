# nginx site for the API at dili-chinese.uz. On the server:
#   sudo cp deploy/nginx/course-platform-api.conf /etc/nginx/sites-available/course-platform-api
# certbot adds the HTTPS (443) part and the http -> https redirect to this file itself.

# nginx sizes this from the CPU's cache line. The VPS's virtual CPU makes it 32,
# too small for "dili-chinese.uz" ("could not build server_names_hash").
server_names_hash_bucket_size 64;

# Requests for any other name, or for the bare IP, are dropped
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name dili-chinese.uz;

    server_tokens off;

    # avatars and course images can be 5 MB; nginx's default limit is 1 MB
    client_max_body_size 6m;

    # compress JSON responses
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Uploaded images, straight from disk: the API never sees these requests.
    # Needs UPLOADS_HOST_DIR=/srv/course-platform/uploads in the server's .env.
    # Only names the API itself creates are served (<folder>/<uuid>.webp); anything else is a 404.
    location ~ "^/uploads/(users|courses)/[0-9a-f-]{36}\.webp$" {
        root /srv/course-platform;
        types { image/webp webp; }
        log_not_found off;
        # the same headers the API sends; without "always", so a 404 isn't cached for a year
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cross-Origin-Resource-Policy cross-origin; # the frontend is on another origin
        add_header X-Content-Type-Options nosniff;
    }
    location /uploads/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the same id appears in nginx's log and the API's log
        proxy_set_header X-Request-Id $request_id;
    }
}
